{%extends 'artist/main.html'%}
{%block content%}

<div class="dc">
  <div class="frm">
    <h2 class="my-4 beige text-center">Artist Registration</h2>
    <form method="post" enctype="multipart/form-data" class="mt-4">
      {% csrf_token %}
      <div class="form-floating mb-3">
        <input type="text" id="phone" placeholder="" name="phone" class="form-control" required>
        <label for="phone">Phone Number</label>
      </div>
      <div class="form-floating mb-3">
        <input type="password" id="password" placeholder="" name="password" class="form-control" required>
        <label for="password">Password</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" id="name" name="name" placeholder="" class="form-control" required>
        <label for="name">Full Name</label>
      </div>
      <div class="form-floating mb-3">
        <select id="category" name="category" class="form-select" required>
          <option value="" disabled selected>Select category</option>
          <option value="Abstract">Abstract</option>
          <option value="Wildlife">Wildlife</option>
          <option value="Landscape">Landscape</option>
          <option value="Portrait">Portrait</option>
          <option value="Still Life">Still Life</option>
          <option value="Impressionism">Impressionism</option>
          <option value="Surrealism">Surrealism</option>
          <option value="Realism">Realism</option>
          <option value="Nature">Nature</option>
        </select>
        <label for="category">Art Category</label>
      </div>
      <div class="form-floating mb-3">
        <input type="email" id="email" name="email" placeholder="" class="form-control" required>
        <label for="email">Email</label>
      </div>
      <div class="form-floating mb-3">
        <textarea id="bio" name="bio" placeholder="" class="form-control" style="height:90px;"></textarea>
        <label for="bio">Bio (optional)</label>
      </div>
      <div class="form-floating mb-3">
        <input type="file" class="form-control" placeholder="" id="pic" name="pic" accept="image/*" required>
        <label for="pic">Profile Picture</label>
      </div>
      <a href="/artist_login/" style="color:#ff4d6d;">Already registered? Login →</a>
      <button type="submit" class="btna mt-3">Register</button>
    </form>
  </div>
</div>
{%endblock%}
