{%extends 'html/main.html'%}
{%block content%}

<div class="dc">
  <div class="frm">
    <h1 class="text-center beige mb-4" style="font-size:2.5rem;font-weight:800;">Contact Us</h1>
    <p class="beige mb-4" style="text-align:center;opacity:.8;">Have a question or inquiry? We'd love to hear from you.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="name" name="name" placeholder=" " required
          {%if user%}value="{{user.name}}"{%endif%}>
        <label for="name">Your Name</label>
      </div>
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" name="email" placeholder=" " required
          {%if user%}value="{{user.email}}"{%endif%}>
        <label for="email">Email Address</label>
      </div>
      <div class="form-floating mb-3">
        <textarea class="form-control" id="query" name="query" placeholder=" " required style="height:120px;"></textarea>
        <label for="query">Your Message</label>
      </div>
      <button type="submit" class="btna">Send Message</button>
    </form>
  </div>
</div>
{%endblock%}
